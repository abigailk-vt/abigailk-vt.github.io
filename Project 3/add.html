<!-- This is the HTML for the "Add New Item" design/page -->
<!doctype html>
<html lang="en">
<!-- Header -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="This page is for when a user adds a new jersey">
  <title>Add a Jersey | Kit Central</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/jquery-3.7.1.min.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <!-- Navigation -->
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="site-shell">
    <header class="site-header">
      <div class="header-center">
      <a class="brand" href="home.html" aria-label="Kit Central, home">
        <span class="brand-mark" aria-hidden="true">⚽</span>
        <span class="brand-name">Kit Central</span></a>
      <form class="search-form header-search" role="search" action="search.html" method="get">
        <label for="header-search">Search jerseys</label>
        <input id="header-search" name="q" type="text" placeholder="Try Luka Modric">
        <button class="button" type="submit">Search</button>
      </form>
      </div>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="home-alternate.html">Home</a>
        <a href="profile.html">My Profile</a>
        <a href="list.html">Browse</a>
        <a href="about.html">About Us</a>
        <a href="home.html">Log Out</a>
      </nav>
    </header>
    <main id="main">
<header class="page-intro">
  <h1>Add New Jersey</h1>
</header>
<!-- This is the form inputs for adding a photo, name, description, and tags for the jersey -->
<form class="editor-layout" action="#" method="get">
  <div class="upload-panel">
    <span class="upload-symbol" aria-hidden="true">↑</span>
    <label for="jersey-photo">Jersey Photo</label>
    <p>Choose a photo of your jersey.</p>
    <input id="jersey-photo" name="photo" type="file" accept="image/*" required aria-describedby="photo-error">
    <p class="field-error" id="photo-error">Required: Upload a jersey photo.</p>
  </div>
  <div class="editor-fields">
    <div class="field">
      <label for="jersey-name">Name</label>
      <input id="jersey-name" name="name" type="text" required autocomplete="off" placeholder="[Jersey name]" aria-describedby="name-error">
      <p class="field-error" id="name-error">Required: Enter a jersey name.</p>
    </div>
    <div class="field">
      <label for="jersey-description">Description</label>
      <textarea id="jersey-description" name="description" required placeholder="[Write your jersey description]" aria-describedby="description-error"></textarea>
      <p class="field-error" id="description-error">Required: Enter a description.</p>
    </div>
    <div class="field">
      <label for="jersey-tags">Tags</label>
      <input id="jersey-tags" name="tags" type="text" aria-describedby="tags-help" placeholder="[Tag one], [tag two]">
      <span class="field-help" id="tags-help">Separate tags with commas.</span>
    </div>
    <div class="button-row form-actions">
      <a class="button secondary" href="list.html">Cancel</a>
      <button class="button" type="button">Add jersey</button>
    </div>
  </div>
</form></main>
<!-- Footer -->
    <footer class="site-footer">
      <nav aria-label="Footer navigation">
        <a href="about.html">About us</a>
        <a href="faq.html">FAQ</a>
        <a href="list.html">Site navigation</a>
      </nav>
    </footer>
  </div>
</body>
</html>
