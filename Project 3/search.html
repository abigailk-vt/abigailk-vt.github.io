<!-- This is the HTML for the "List" design/page -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simulated jersey search results">
  <title>Search results | Kit Central</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/jquery-3.7.1.min.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <!-- Navigation -->
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="site-shell">
    <header class="site-header">
      <div class="header-center">
      <a class="brand" href="home.html" aria-label="Kit Central, home">
        <span class="brand-mark" aria-hidden="true">⚽</span>
        <span class="brand-name">Kit Central</span
          ></a>
      <form class="search-form header-search" role="search" action="search.html" method="get">
        <label for="header-search">Search jerseys</label>
        <input id="header-search" name="q" type="text" placeholder="Try Luka Modric">
        <button class="button" type="submit">Search</button>
      </form>
      </div>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="home-alternate.html">Home</a>
        <a href="profile.html">My Profile</a>
        <a href="list.html">Browse</a>
        <a href="about.html">About Us</a>
        <a href="home.html">Log Out</a>
      </nav>
    </header>
    <main id="main">
      <header class="page-intro"><h1>Search results</h1></header>
      <p id="search-summary" role="status"></p>
      <section id="search-results" class="product-grid" aria-label="Search results"></section>
      <noscript><p>Enable JavaScript to view simulated search results. Try searching for Luka Modric.</p></noscript>
      <div class="button-row"><a class="button secondary" href="list.html">Back to collection</a></div>
    </main>
<!-- Footer -->
    <footer class="site-footer">
      <nav aria-label="Footer navigation">
        <a href="about.html">About us</a>
        <a href="faq.html">FAQ</a>
        <a href="list.html">Site navigation</a>
      </nav>
    </footer>
  </div>
</body>
</html>
